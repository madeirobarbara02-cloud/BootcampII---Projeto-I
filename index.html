<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca 📚</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Biblioteca 📚</h1>
    <p class="subtitulo">Consulte o acervo da Open Library</p>
    
    <div class="search-box">
      <input type="text" id="campo-busca" placeholder="Digite o nome de um livro (ex: Harry Potter)...">
      <button id="botao-buscar">Buscar</button>
    </div>

    <div id="resultado" class="card"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
